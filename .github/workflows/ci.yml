name: Continuous Integration

on:
  push:
    branches:
      - main
      - Release
      - release
  pull_request:
    branches:
      - main
      - Release
      - release

jobs:
  test:
    name: Test & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Verify Dependencies
        run: |
          go mod verify

      - name: Build gateway-data Binary
        run: |
          go build -v -trimpath ./cmd/gateway-data

      - name: Run Unit Tests
        run: |
          go test -v -race -timeout 180s ./...
